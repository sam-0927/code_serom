samplerate: 16000

pretrained_path: ""   # optional: path to a previous se_model checkpoint
cond: "content"       # no | content | both

n_mels: 80

# vocoder_config: only n_fft and hop_length are used (for MelSpectrogram supervision)
vocoder_config:
  n_fft: 1280
  hop_length: 320

optimizer:
  betas: [0.8, 0.99]
  weight_decay: 0.01
  warmup_epochs: 1
  decay_epochs: 25
  se:
    lr: 1.0e-4
    max_lr: 2.0e-4
    min_lr: 1.0e-6
  dec:
    lr: 1.0e-4
    max_lr: 2.0e-4
    min_lr: 1.0e-6

coeff:
  mel_l1: 5.0
  ctc:    2.0

train_dataset:
  filelist: /workspace/DB/librispeech_se_snr-515/metadata.txt
  default_fs: 16000

train_dataloader:
  batch_size: 16
  num_workers: 4
  drop_last: true
  pin_memory: true

validation_dataset:
  filelist: /workspace/DB/librispeech_se_snr-515_eval/dev-clean/metadata.txt
  default_fs: 16000

validation_dataloader:
  batch_size: 1
  num_workers: 4
  drop_last: true
  pin_memory: true

trainer:
  epochs: 100
  save_checkpoint_interval: 10
  clip_grad_norm_value: 3.0
  exp_path: outputs/exp_stage1
  resume: false
